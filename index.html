<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#EDF1EA" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Планер" />
    <link rel="icon" href="/planner-milana/icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/planner-milana/icons/apple-touch-icon.png" />
    <title>Планер</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Для работы планера нужен JavaScript.</noscript>
    <script>
      // Если приложение не запустилось за 8 секунд — показываем подсказку вместо белой страницы.
      setTimeout(function () {
        var r = document.getElementById('root');
        if (r && !r.children.length) {
          r.innerHTML = '<p style="font:16px system-ui;padding:24px;color:#2F3A33">Планер не загрузился. Обновите страницу. Если не поможет — пришлите скриншот.</p>';
        }
      }, 8000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
